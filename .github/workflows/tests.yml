name: Tests
# Runs on pull requests, by hand, and before every deploy (deploy.yml calls it).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Includes the migration tests against PostgreSQL in Docker (Testcontainers).
      - name: Run tests
        run: ./mvnw -B test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run browser tests
        run: npm run test:e2e

      - name: Keep report and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            task-frontend/playwright-report
            task-frontend/test-results
          retention-days: 7
