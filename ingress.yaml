apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-app-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "task-app-ip"
    networking.gke.io/managed-certificates: "task-app-cert"
spec:
  rules:
  - http:
      paths:
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: spring-api
            port:
              number: 80
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: task-frontend
            port:
              number: 80
